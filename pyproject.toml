[project]
name = "comfyui-updated-pack"
version = "1.0.0"
description = "A comprehensive collection of ComfyUI custom nodes updated for transformers 5.0.0+ compatibility"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Mixed - See individual component licenses"}
authors = [
    {name = "ComfyUI Updated Pack Maintainers"},
]
keywords = ["comfyui", "custom-nodes", "image-generation", "segment-anything", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy<2",
    "Pillow>=9.4.0",
    "transformers>=5.0.0",
    "timm>=0.4.12",
    "addict",
    "yapf",
    "tqdm>=4.66.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "matplotlib>=3.9.1",
    "opencv-python>=4.7.0",
    "cmake",
    "fairscale>=0.4.4",
    "gitpython",
    "imageio",
    "joblib",
    "numba",
    "opencv-python-headless",
    "pilgram",
    "rembg",
    "scikit-image>=0.20.0",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
imagereward = [
    "image-reward",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/ComfyUI-Updated-Pack"
Documentation = "https://github.com/YOUR-USERNAME/ComfyUI-Updated-Pack#readme"
Repository = "https://github.com/YOUR-USERNAME/ComfyUI-Updated-Pack"
"Bug Tracker" = "https://github.com/YOUR-USERNAME/ComfyUI-Updated-Pack/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ComfyUI-ImageReward", "ComfyUI-SAM2", "was-node-suite-comfyui"]

[tool.setuptools.package-data]
"ComfyUI-SAM2" = ["sam2_configs/*.yaml"]
"was-node-suite-comfyui" = ["res/*.xml", "modules/BLIP/blip_configs/*.json", "modules/BLIP/blip_configs/*.yaml"]
